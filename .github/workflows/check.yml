name: Project Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_IDENTITY_WEBHOOK_SECRET: ${{ secrets.STRIPE_IDENTITY_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      APP_URL: http://localhost:3000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Check required environment variables
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "Missing NEXT_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || (echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$STRIPE_SECRET_KEY" || (echo "Missing STRIPE_SECRET_KEY" && exit 1)
          test -n "$STRIPE_IDENTITY_WEBHOOK_SECRET" || (echo "Missing STRIPE_IDENTITY_WEBHOOK_SECRET" && exit 1)
          test -n "$RESEND_API_KEY" || (echo "Missing RESEND_API_KEY" && exit 1)
          test -n "$CRON_SECRET" || (echo "Missing CRON_SECRET" && exit 1)
          test -n "$APP_URL" || (echo "Missing APP_URL" && exit 1)

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Start app
        run: pnpm start &

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App failed to start"
          exit 1

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Run product flow test
        run: pnpm test:product

      - name: Run expiry flow test
        run: pnpm test:expiry

      - name: Check live Vercel app
        run: |
          curl -I --fail --max-time 20 https://intentionally-seven.vercel.app/

  email-auth-live:
    runs-on: ubuntu-latest

    env:
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      MAILPIT_URL: http://127.0.0.1:54324
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_IDENTITY_WEBHOOK_SECRET: ${{ secrets.STRIPE_IDENTITY_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Configure local dual-path auth email
        run: |
          cat >> supabase/config.toml <<'EOF'

          [auth.email.template.magic_link]
          subject = "Your Intentionally sign-in"
          content_path = "./supabase/templates/magic_link.html"
          EOF

      - name: Start local Supabase
        run: pnpm exec supabase start

      - name: Export local Supabase environment
        run: |
          eval "$(pnpm exec supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Typecheck auth harness
        run: pnpm typecheck

      - name: Lint auth harness
        run: pnpm lint

      - name: Build against local Supabase
        run: pnpm build

      - name: Start app against local Supabase
        run: pnpm start &

      - name: Wait for app and Mailpit
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null && curl -s http://127.0.0.1:54324 > /dev/null; then
              echo "App and Mailpit are ready"
              exit 0
            fi
            echo "Waiting for app and Mailpit..."
            sleep 2
          done
          echo "App or Mailpit failed to start"
          exit 1

      - name: Run live email auth test
        run: pnpm exec playwright test tests/e2e/email-auth-live.spec.ts

      - name: Stop local Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
