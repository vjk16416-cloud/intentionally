name: Project Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_IDENTITY_WEBHOOK_SECRET: ${{ secrets.STRIPE_IDENTITY_WEBHOOK_SECRET }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      APP_URL: http://localhost:3000
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Check required environment variables
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || (echo "Missing NEXT_PUBLIC_SUPABASE_URL" && exit 1)
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || (echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY" && exit 1)
          test -n "$STRIPE_SECRET_KEY" || (echo "Missing STRIPE_SECRET_KEY" && exit 1)
          test -n "$STRIPE_IDENTITY_WEBHOOK_SECRET" || (echo "Missing STRIPE_IDENTITY_WEBHOOK_SECRET" && exit 1)
          test -n "$RESEND_API_KEY" || (echo "Missing RESEND_API_KEY" && exit 1)
          test -n "$APP_URL" || (echo "Missing APP_URL" && exit 1)
          test -n "$CRON_SECRET" || (echo "Missing CRON_SECRET" && exit 1)

      - name: Verify production deployment credentials
        run: |
          expected="https://opfbojqdwyfqannyvbua.supabase.co"
          test "$NEXT_PUBLIC_SUPABASE_URL" = "$expected" || (echo "GitHub Supabase URL does not target active intentionally-mvp" && exit 2)
          publishable_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "$expected/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY")
          test "$publishable_status" = "200" || (echo "GitHub publishable credential is not valid for active intentionally-mvp, HTTP $publishable_status" && exit 3)
          service_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "$expected/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          test "$service_status" = "200" || (echo "GitHub service credential is not valid for active intentionally-mvp, HTTP $service_status" && exit 4)
          test -n "$VERCEL_TOKEN" || (echo "Missing VERCEL_TOKEN GitHub secret" && exit 5)
          vercel_status=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "https://api.vercel.com/v10/projects/prj_FH0Mds4U70zM8hWAU7mSoAZJCfyK/env?teamId=team_slRZYPwifhlsjPDBmf9v8XQU" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          test "$vercel_status" = "200" || (echo "VERCEL_TOKEN cannot read production environment, HTTP $vercel_status" && exit 6)
          echo "Production deployment credentials verified without exposing secret values."

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check security regressions
        run: pnpm test:security

      - name: Check Q&A reminder window
        run: pnpm test:qa-reminders

      - name: Check Discover journey copy
        run: pnpm exec tsx scripts/test-discover-journey.ts

      - name: Check chat unlock transition
        run: pnpm exec tsx scripts/test-chat-unlock-flow.ts

      - name: Check Daily room security
        run: pnpm test:daily-security

      - name: Build
        run: pnpm build

      - name: Start app
        run: pnpm start &

      - name: Wait for app
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app..."
            sleep 2
          done
          echo "App failed to start"
          exit 1

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Run product flow test
        run: pnpm test:product

      - name: Run expiry flow test
        run: pnpm test:expiry

      - name: Check live Vercel app
        run: |
          curl -I --fail --max-time 20 https://intentionally-seven.vercel.app/
