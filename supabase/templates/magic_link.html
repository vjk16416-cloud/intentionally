<!doctype html>
<html lang="en">
  <body>
    <h2>Sign in to Intentionally</h2>
    <p data-auth-email="{{ .Email }}">Use either option below to sign in as {{ .Email }}.</p>

    <p>Your 6-digit sign-in code is:</p>
    <p><strong data-auth-token="{{ .Token }}">{{ .Token }}</strong></p>

    <p>
      <a id="magic-link" href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/discover">
        Sign in securely
      </a>
    </p>

    <p>If you did not request this email, you can ignore it.</p>
  </body>
</html>
