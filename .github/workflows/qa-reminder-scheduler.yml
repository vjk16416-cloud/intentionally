name: Q&A Reminder Scheduler

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: qa-reminder-scheduler
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      QA_REMINDER_URL: https://intentionally-seven.vercel.app/api/cron/qa-reminders

    steps:
      - name: Invoke Q&A reminder route with GitHub OIDC
        run: |
          OIDC_TOKEN="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --get \
              --data-urlencode "audience=$QA_REMINDER_URL" \
              -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL" \
              | jq --exit-status --raw-output '.value'
          )"
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --max-time 30 \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "$QA_REMINDER_URL"
